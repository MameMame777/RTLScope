[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/local/rtlscope"

[workspace.dependencies]
rtlscope-ir = { path = "crates/rtlscope-ir" }
rtlscope-sv = { path = "crates/rtlscope-sv" }
rtlscope-elab = { path = "crates/rtlscope-elab" }
rtlscope-graph = { path = "crates/rtlscope-graph" }
rtlscope-cli = { path = "crates/rtlscope-cli" }
rtlscope-analyse = { path = "crates/rtlscope-analyse" }
rtlscope-wave = { path = "crates/rtlscope-wave" }
rtlscope-tb = { path = "crates/rtlscope-tb" }
rtlscope-yosys = { path = "crates/rtlscope-yosys" }
rtlscope-fixtures = { path = "crates/rtlscope-fixtures" }
rtlscope-veryl = { path = "crates/rtlscope-veryl" }
rtlscope-read = { path = "crates/rtlscope-read" }

sv-parser = "0.13.5"
wellen = "0.25.6"
petgraph = { version = "0.8.3", features = ["stable_graph"] }
rust-sugiyama = "0.4.0"
egui = "0.35"
eframe = "0.35"
# The docking layout. 0.20 is the release that tracks egui 0.35; 0.21 moved to
# 0.36. `serde` is what lets the whole desk — splits, sizes, floating windows —
# go to `layout.json` as one value; it also turns on `egui/serde`.
egui_dock = { version = "0.20.1", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dunce = "1"
insta = { version = "1", features = ["json", "redactions"] }
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
rfd = "0.17"
# Source Map v3, for reading the .sv.map a transpiler leaves beside its SystemVerilog.
sourcemap = "9"

[profile.release]
opt-level = 2
